<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622"/>
      <stop offset="50%" stop-color="#090d15"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Ambient Radial Glow Behind Balloon Letters -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#94a3b8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Signature 3D Liquid Chrome Balloon Gradient -->
    <linearGradient id="chromeGradM" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#718096"/>
      <stop offset="18%" stop-color="#cbd5e1"/>
      <stop offset="34%" stop-color="#ffffff"/>
      <stop offset="47%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="54%" stop-color="#0f172a"/>
      <stop offset="68%" stop-color="#64748b"/>
      <stop offset="84%" stop-color="#e2e8f0"/>
      <stop offset="93%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="chromeGradA" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="16%" stop-color="#cbd5e1"/>
      <stop offset="32%" stop-color="#ffffff"/>
      <stop offset="46%" stop-color="#f8fafc"/>
      <stop offset="49%" stop-color="#1e293b"/>
      <stop offset="53%" stop-color="#0f172a"/>
      <stop offset="66%" stop-color="#475569"/>
      <stop offset="82%" stop-color="#e2e8f0"/>
      <stop offset="92%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#718096"/>
    </linearGradient>

    <!-- Chrome Outer Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#94a3b8" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Balloon Puffy Specular Highlight -->
    <linearGradient id="puffyHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom Balloon Ambient Bounce Light -->
    <linearGradient id="bounceLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="balloonShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Star Glint Glow -->
    <radialGradient id="glintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Icon Squircle Canvas -->
  <rect x="3" y="3" width="122" height="122" rx="28" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="122" height="122" rx="28" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="64" cy="64" r="52" fill="url(#centerGlow)"/>

  <!-- ================= 3D CHROME BALLOON LETTERS (MA) ================= -->
  <g filter="url(#balloonShadow)">
    
    <!-- === LETTER 'M' === -->
    <!-- 1. Rim & Bevel Base -->
    <path d="M 24 93 L 24 40 L 41 68 L 58 40 L 58 93"
          fill="none"
          stroke="url(#rimGrad)"
          stroke-width="15"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 2. Main Liquid Chrome Balloon Body -->
    <path d="M 24 93 L 24 40 L 41 68 L 58 40 L 58 93"
          fill="none"
          stroke="url(#chromeGradM)"
          stroke-width="13"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 3. Balloon Bottom Reflective Bounce Rim -->
    <path d="M 24 93 L 24 65 M 58 93 L 58 65"
          fill="none"
          stroke="url(#bounceLight)"
          stroke-width="7"
          stroke-linecap="round"/>

    <!-- 4. Puffy Upper Specular Highlight (The Inflatable Look) -->
    <path d="M 23 48 L 23 39 L 41 65 L 59 39 L 59 48"
          fill="none"
          stroke="url(#puffyHighlight)"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- Balloon highlight streak on left and right bulges -->
    <ellipse cx="23.5" cy="58" rx="2" ry="11" fill="#ffffff" opacity="0.65"/>
    <ellipse cx="58.5" cy="58" rx="2" ry="11" fill="#ffffff" opacity="0.65"/>


    <!-- === LETTER 'A' === -->
    <!-- 1. Rim & Bevel Base -->
    <path d="M 71 93 L 87 40 L 103 93"
          fill="none"
          stroke="url(#rimGrad)"
          stroke-width="15"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <path d="M 77 73 L 97 73"
          fill="none"
          stroke="url(#rimGrad)"
          stroke-width="12.5"
          stroke-linecap="round"/>

    <!-- 2. Main Liquid Chrome Balloon Body -->
    <path d="M 71 93 L 87 40 L 103 93"
          fill="none"
          stroke="url(#chromeGradA)"
          stroke-width="13"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <path d="M 77 73 L 97 73"
          fill="none"
          stroke="url(#chromeGradA)"
          stroke-width="10.5"
          stroke-linecap="round"/>

    <!-- 3. Balloon Bottom Reflective Bounce Rim -->
    <path d="M 71 93 L 75 78 M 103 93 L 99 78"
          fill="none"
          stroke="url(#bounceLight)"
          stroke-width="6.5"
          stroke-linecap="round"/>

    <!-- 4. Puffy Upper Specular Highlight (The Inflatable Look) -->
    <path d="M 73 52 L 87 38.5 L 101 52"
          fill="none"
          stroke="url(#puffyHighlight)"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <ellipse cx="87" cy="71.5" rx="7" ry="1.8" fill="#ffffff" opacity="0.7"/>
    <ellipse cx="102" cy="72" rx="2" ry="8" fill="#ffffff" opacity="0.6"/>

  </g>

  <!-- ================= SPARKLING CHROME GLINTS ================= -->
  <!-- Top Left M Shoulder Star Glint -->
  <g transform="translate(24, 37)">
    <circle cx="0" cy="0" r="5" fill="url(#glintGlow)"/>
    <path d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="#ffffff"/>
    <circle cx="0" cy="0" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Apex of A Star Glint -->
  <g transform="translate(87, 39)">
    <circle cx="0" cy="0" r="6" fill="url(#glintGlow)"/>
    <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7 Z" fill="#ffffff"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Small Cute Bubble Shimmer on Right Base of A -->
  <g transform="translate(103, 88)">
    <circle cx="0" cy="0" r="3.5" fill="url(#glintGlow)"/>
    <path d="M 0 -3.5 Q 0 0 3.5 0 Q 0 0 0 3.5 Q 0 0 -3.5 0 Q 0 0 0 -3.5 Z" fill="#ffffff"/>
  </g>
</svg>